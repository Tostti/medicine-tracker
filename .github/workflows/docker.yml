# Builds the backend and web images.
# - Pull requests: build only, to catch a broken Dockerfile before merging.
# - main: publish to GHCR as :latest and :sha-<commit>.
# - Tags like v1.2.3: publish as :1.2.3 and :1.2 too, and create the GitHub Release.
#
# Production should pin IMAGE_TAG to a release (see "Releasing" in the README): :latest
# follows main, so every merge would reach the server on its next pull.
#
# The server only needs docker-compose.yml and .env, then `docker compose pull`.
name: Docker images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write # push to ghcr.io/<owner>/...

jobs:
  image:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: backend
          - service: web
            context: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; the owner (Tostti) isn't.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medicine-tracker-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # Tags, plus OCI labels that link the package to this repo (it inherits the repo's visibility).
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # What the app shows as its version: the release for a tag, otherwise the commit.
      - name: App version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the web image uses it; the backend's Dockerfile ignores it.
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          # Reuse unchanged layers (dependency installs) between runs.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # After both images are published, so a release never points at missing images.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      # Notes generated from the pull requests merged since the previous tag.
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
